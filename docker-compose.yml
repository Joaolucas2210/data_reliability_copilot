# Profiles (see docs/operations/local-runbook.md):
#   (default) postgres only         ~150 MB RAM
#   lineage   + Marquez API/web     ~+700 MB RAM (JVM)
#   obs       + Jaeger (OTLP) + MLflow UI
name: drc
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: drc_admin
      POSTGRES_PASSWORD: ${DRC_ADMIN_PASSWORD:-local-admin-only}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "log_statement=ddl"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drc_admin -d postgres"]
      interval: 3s
      retries: 20
    deploy: {resources: {limits: {memory: 512m, cpus: "1.0"}}}

  marquez:
    profiles: [lineage]
    image: marquezproject/marquez:0.51.1
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez-local-only
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml
    volumes: ["./infra/local/marquez.yml:/opt/marquez/marquez.yml:ro"]
    ports: ["127.0.0.1:5000:5000", "127.0.0.1:5001:5001"]
    deploy: {resources: {limits: {memory: 768m, cpus: "1.0"}}}

  marquez-web:
    profiles: [lineage]
    image: marquezproject/marquez-web:0.51.1
    depends_on: [marquez]
    environment: {MARQUEZ_HOST: marquez, MARQUEZ_PORT: 5000, WEB_PORT: 3000}
    ports: ["127.0.0.1:3000:3000"]
    deploy: {resources: {limits: {memory: 256m}}}

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    deploy: {resources: {limits: {memory: 512m}}}

volumes:
  pgdata:
