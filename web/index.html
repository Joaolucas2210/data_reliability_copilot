<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Reliability Copilot</title>
    <script>
      // resolve the colour scheme before first paint (same key as Mantine's localStorage manager) — no flash
      try {
        var v = localStorage.getItem("drc-color-scheme") || "auto";
        if (v === "auto") v = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", v);
      } catch (e) { document.documentElement.setAttribute("data-mantine-color-scheme", "light"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
